<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="New stock">
<meta name="theme-color" content="#2f4a3a">
<title>Poppie's — New stock</title>
<style>
:root{--ink:#1f2a24;--quiet:#5d6b63;--line:#d9dfdb;--bg:#f6f4ef;--card:#fff;--green:#2f4a3a;--accent:#3d6b52;--warn:#a3561c;--bad:#a12b2b}
*{box-sizing:border-box}
body{margin:0;font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);padding:env(safe-area-inset-top) 0 40px}
header{background:var(--green);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:19px;margin:0}
header button{background:transparent;color:#fff;border:1px solid #ffffff80;padding:6px 12px;border-radius:8px;font-size:15px}
main{max-width:920px;margin:0 auto;padding:20px}
h2{font-size:22px;margin:4px 0 14px}
p.q{color:var(--quiet);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.big{display:block;width:100%;padding:18px 12px;font-size:19px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
.big:active{border-color:var(--accent);background:#e6efe9}
.primary{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:16px 22px;font-size:19px;font-weight:600}
.primary:disabled{opacity:.45}
.secondary{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:16px;color:var(--ink)}
.small{padding:4px 10px;font-size:14px;border-radius:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
input{font-size:17px;padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--ink)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.thumbs img{width:110px;height:140px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse}
th{font-size:13px;text-align:left;color:var(--quiet);font-weight:600;padding:6px 4px}
td{padding:4px;vertical-align:top}
td input{padding:8px}
tr.sub td{padding-top:0}
.tag{font-size:12px;color:#fff;background:var(--accent);border-radius:6px;padding:1px 6px;margin-left:4px}
.note{border-left:4px solid var(--warn);background:#fbf1e8;padding:10px 12px;border-radius:6px;margin:10px 0;font-size:15px}
.ok{border-left-color:var(--accent);background:#e6efe9}
.err{border-left-color:var(--bad);background:#f8e6e6}
.muted{color:var(--quiet);font-size:14px}
.spinner{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
.list div{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>Poppie's · New stock &amp; deliveries</h1><button onclick="homeScreen()">Home</button></header>
<div id="busy" style="max-width:920px;margin:0 auto;padding:0 20px"></div><main id="app"></main>
<script>
const API = "https://xcolpextsojdtbfscvse.supabase.co/functions/v1/delivery-app";
const DEPTS = ["Garden","Gift Store","Grocer"];
// one-time device setup: open .../#key=<device key> on the shop iPad
(function(){
  const m = location.hash.match(/key=([0-9a-f]{48})/), o = location.hash.match(/owner=([0-9a-f]{48})/);
  try { if (m) localStorage.setItem("pd_key", m[1]); if (o) localStorage.setItem("pd_owner", o[1]); } catch(e){}
  if (m || o) history.replaceState(null, "", location.pathname);
})();
let KEY = null, OWNER = null; try { KEY = localStorage.getItem("pd_key"); OWNER = localStorage.getItem("pd_owner"); } catch(e) {}
let S = { dept: "Garden", supplier: null, photos: [], receipt: null };
// Unsent photo set kept across Home, Recent deliveries and the idle timer. op is a durable upload id: the server
// uses it as the receipt id, so sending the same set again can never create a second delivery.
let DRAFT = null;
const newOp = () => (typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx".replace(/x/g, () => (Math.random() * 16 | 0).toString(16)));
let VIEW = 0; // bumped on every screen render; async work started on an older screen must not write into a newer one
const $ = (h) => { VIEW++; RETRY = null; clearBusy(); document.getElementById("app").innerHTML = h; window.scrollTo(0,0); };
// JS string literal for use inside a double-quoted onclick="..." (JSON for JS, then HTML-escaped for the attribute)
const ja = (v) => esc(JSON.stringify(String(v ?? "")));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path, opts = {}) {
  let r;
  try { r = await fetch(API + path, { ...opts, headers: { "content-type": "application/json", "x-device-key": KEY || "", ...(OWNER ? {"x-owner-key": OWNER} : {}) } }); }
  catch (e) { return { ok: false, status: 0, body: { error: "No connection. Check the wifi and try again." } }; }
  let b = await r.json().catch(() => null);
  if (!b || typeof b !== "object") b = {};
  if (r.status === 401) { noKey(); throw new Error("no key"); }
  // 503 = the back end couldn't read its settings. The key may be fine: never show the setup screen for this.
  if (r.status === 503) busyBanner(b && b.error);
  return { ok: r.ok, status: r.status, body: b };
}
// RETRY: the current screen's read-only loader (set by screens that only read). Write screens leave it null.
let RETRY = null;
function busyBanner(msg) {
  const el = document.getElementById("busy");
  if (!el) return;
  el.innerHTML = `<div class="note err" style="margin:0 0 14px">${esc(msg || "The app can't reach its settings right now.")} <button class="secondary small" onclick="retryView()">${RETRY ? "Try again" : "OK"}</button></div>`;
}
function clearBusy() { const el = document.getElementById("busy"); if (el) el.innerHTML = ""; }
function retryView() { clearBusy(); const f = RETRY; if (f) f(); }
// Error block for a failed read: says what happened and offers a retry of the same read only.
function loadErr(r, what, retryCall) {
  const msg = r && r.status === 0 ? "No connection." : r && r.status === 503 ? "The app can't reach its settings right now." : `Couldn't load ${what}.`;
  return `<div class="note err">${esc(msg)} <button class="secondary small" onclick="${retryCall}">Try again</button></div>`;
}
function noKey(){ $(`<h2>This iPad isn't set up yet</h2><p>Ask Josh to open the setup link on this iPad once. After that it opens straight to the app.</p>`); }

// ---------- home
let idleT; function idle(){ clearTimeout(idleT); idleT = setTimeout(() => { if (!S.receipt) homeScreen(); }, 15*60*1000); }
async function homeScreen() {
  if (!KEY && !OWNER) return noKey();
  if (S.photos.length && !S.receipt) DRAFT = { dept: S.dept, supplier: S.supplier, photos: S.photos, op: S.op, uncertain: !!S.uncertain };
  S = { dept: S.dept, supplier: null, photos: [], receipt: null }; WHO = null;
  $(`${DRAFT ? `<div class="note" style="margin:0 0 14px"><b>Unsent photos</b> for ${esc(DRAFT.supplier)} (${DRAFT.photos.length} photo${DRAFT.photos.length === 1 ? "" : "s"})${DRAFT.uncertain ? " — the last send may have arrived; check Recent deliveries below. Sending again won't create a second copy." : "."}
  <div class="row" style="margin-top:8px"><button class="primary small" onclick="resumeDraft()">Resume</button><button class="secondary small" onclick="discardDraft()">Discard</button></div></div>` : ""}<div id="own"><div id="own-josh"></div><div id="own-needs"></div></div><div class="row" style="margin:0 0 18px"><button class="big" style="width:auto;padding:14px 22px" onclick="pricesScreen()">Shelf prices</button></div><div id="dlv"></div><h2>New delivery</h2><p class="q">Which department is it for?</p>
  <div class="grid">${DEPTS.map(d=>`<button class="big" onclick="S.dept='${d}';supplierScreen()">${d}</button>`).join("")}</div>
  <h2 style="margin-top:28px">Recent deliveries</h2><p class="muted" style="margin:-8px 0 6px">All retail deliveries from the last 14 days. Tap a <span class="tag">photo</span> one to see its new products and print labels.</p>
  <div class="row" style="margin:0 0 6px">${["All", ...DEPTS].map(d => `<button id="rd-${d.replace(" ","")}" class="secondary small" onclick="RD.dept='${d}';drawRecent()">${d}</button>`).join("")}</div>
  <div class="list" id="recent"><span class="muted">Loading…</span></div><div id="months"></div>`);
  loadDeliveries();
  RETRY = homeScreen;
  const v = VIEW;
  const [r, rd] = await Promise.all([api("/recent"), api("/recent-deliveries")]);
  if (v !== VIEW || !document.getElementById("recent")) return; // navigated away while loading
  RD.photos = {}; for (const x of ((r.body && r.body.items) || [])) RD.photos[x.id] = x;
  RD.recent = (rd.ok && rd.body.recent) || []; RD.months = (rd.ok && rd.body.months) || []; RD.open = {}; RD.err = !rd.ok;
  drawRecent();
  if (r.body && r.body.owner) document.getElementById("own-needs").innerHTML = `<div class="row" style="margin:0 0 18px"><button class="secondary" onclick="needsScreen()">Josh: products waiting for a price</button></div>`;
}

// ---------- shelf prices: retail produce list (read-only; copy of Square refreshed every ~10 min)
let PL = { rows: [], dept: "Grocer", at: null }, priceT;
async function pricesScreen() {
  $(`<h2>Shelf prices</h2><div class="spinner"></div>`);
  const r = await api("/prices/all");
  if (!r.ok || !r.body.ok) return $(`<h2>Shelf prices</h2><div class="note err">${esc((r.body && r.body.error) || "Couldn't load the price list. Try again in a minute.")}</div><button class="secondary" onclick="homeScreen()">Back</button>`);
  PL.rows = r.body.rows || []; PL.at = r.body.checked_at;
  const at = PL.at ? new Date(PL.at).toLocaleString("en-AU", { timeZone: "Australia/Melbourne", hour: "numeric", minute: "2-digit", day: "numeric", month: "short" }) : "";
  $(`<h2>Shelf prices</h2><p class="q">Retail produce — what the register charges, from Square${at ? ` (as at ${esc(at)})` : ""}. Type to filter.</p>
  <input id="pq" type="search" placeholder="Filter, e.g. strawberries" autocomplete="off" oninput="clearTimeout(priceT);priceT=setTimeout(priceDraw,200)">
  <div id="pres" style="margin-top:14px"></div><div class="row"><button class="secondary" onclick="homeScreen()">Back</button></div>`);
  priceDraw();
}
function priceFilter(rows, dept, q) {
  const words = (q || "").toLowerCase().split(/\s+/).filter(Boolean);
  return rows.filter(r => (words.length ? true : r.d === dept) &&
      words.every(w => `${r.i} ${r.v || ""} ${r.s || ""}`.toLowerCase().includes(w)))
    .sort((a, b) => (a.d || "").localeCompare(b.d || "") || (a.s || "~").localeCompare(b.s || "~") || a.i.localeCompare(b.i) || (a.v || "").localeCompare(b.v || ""));
}
function priceTable(rows, showDept) {
  if (!rows.length) return `<p class="muted">Nothing matches. Try a shorter word.</p>`;
  let last = null, h = "";
  for (const r of rows) {
    const sec = (showDept ? r.d + " · " : "") + (r.s || "Other");
    if (sec !== last) { h += `<tr><th colspan="2" style="padding-top:14px;color:var(--ink);font-size:15px">${esc(sec)}</th></tr>`; last = sec; }
    h += `<tr style="border-top:1px solid var(--line)"><td>${esc(r.i)}${r.v ? " — " + esc(r.v) : ""}${r.x ? ' <span class="muted">(sold out)</span>' : ""}</td>
    <td style="text-align:right;white-space:nowrap">${r.p == null ? '<span class="muted">Price at register</span>' : `<b>${money(r.p)}</b> ${r.u && r.u !== "each" ? "/ " + esc(r.u) : ""}`}</td></tr>`;
  }
  return `<div class="card" style="padding:8px 12px"><table>${h}</table></div><p class="muted">${rows.length} items</p>`;
}
function priceDraw() {
  const q = (document.getElementById("pq") || {}).value || "";
  document.getElementById("pres").innerHTML = priceTable(priceFilter(PL.rows, PL.dept, q), false);
}

// ---------- a delivery's products (labels)
async function itemsScreen(id) {
  $(`<h2>New products</h2><div class="spinner"></div>`);
  RETRY = () => itemsScreen(id);
  const v = VIEW;
  const r = await api(`/receipts/${id}/items`);
  if (v !== VIEW) return;
  const b = r.body || {}, lines = Array.isArray(b.lines) ? b.lines : null;
  if (!r.ok || !lines) return $(`<h2>New products</h2>${loadErr(r, "this delivery's products", `itemsScreen(${ja(id)})`)}<button class="secondary" onclick="homeScreen()">Back</button>`);
  const lab = { created: "In Square", known: "Already in Square", skipped: "Not stock", needs_josh: "Waiting on Josh", failed: "Problem — Josh notified", pending: "Being set up", dry_run: "Test run only (not in Square)", square_created: "In Square, linking pending" };
  $(`<h2>${esc(b.supplier)} · ${esc(b.department)}</h2>
   ${b.setup_status === "awaiting_price" ? '<p class="q">Some products are waiting for Josh to set a price in Square — don\'t print labels for those yet. They can still be sold: Square will ask for the price at the register.</p>' : ""}
   ${b.setup_status === "ready" || b.setup_status === "awaiting_price" ? '<p class="q">To print labels: in Square, go to Items, search each new product below, tick it, then choose Print labels.</p>' : ""}
   <div class="card"><table><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Status</th></tr></thead><tbody>
   ${lines.map(l => { const x = l.result || {}; return `<tr><td>${esc(x.item_name ? x.item_name + (x.variation_name && x.variation_name !== "Regular" ? " — " + x.variation_name : "") : (l.input||{}).description)}</td><td>${esc(l.sku || x.upc || "")}</td><td>${x.price != null ? "$" + Number(x.price).toFixed(2) : (l.price_state === "awaiting" ? "not set yet" : l.status==="created" ? "at sale" : "")}</td><td class="muted">${esc(l.price_state === "awaiting" ? "In Square — waiting for a price, don't print a label" : l.price_state === "priced" ? "In Square — priced, print label" : (lab[l.status] || l.status))}</td></tr>`; }).join("")}
   </tbody></table></div><button class="primary" onclick="homeScreen()">Done</button>`);
}

// ---------- Josh: prices
async function needsScreen() {
  $(`<h2>Waiting for a price</h2><div class="spinner"></div>`);
  RETRY = needsScreen;
  const v = VIEW;
  const [r, a] = await Promise.all([api("/owner/needs"), api("/owner/awaiting")]);
  if (v !== VIEW) return;
  if (!r.ok || !Array.isArray(r.body) || !a.ok || !Array.isArray(a.body))
    return $(`<h2>Waiting for a price</h2>${loadErr(!r.ok ? r : a, "products waiting for a price", "needsScreen()")}<button class="secondary" onclick="homeScreen()">Back</button>`);
  const rows = r.body, aw = a.body;
  $(`<h2>Waiting for a price</h2>
   ${aw.length ? `<h3>In Square at variable price — set the price in Square</h3><p class="muted">They're already selling (staff type the price at the register). Once you set a price in Square, it comes back to Supabase overnight and staff can print labels.</p><div class="card"><table><thead><tr><th>Product</th><th>Supplier</th><th>Cost ex GST</th><th>Days</th></tr></thead><tbody>${aw.map(x => `<tr><td>${esc(x.item || "")}${x.variation && x.variation !== "Regular" ? " — " + esc(x.variation) : ""}${x.sku ? `<div class="muted">${esc(x.sku)}</div>` : ""}</td><td>${esc(x.supplier)}</td><td>${x.unit_cost_ex != null ? "$" + Number(x.unit_cost_ex).toFixed(2) : "unknown"}</td><td>${esc(String(x.days_waiting ?? ""))}</td></tr>`).join("")}</tbody></table></div>` : ""}
   ${rows.length ? `<h3>Needs checking</h3>` : aw.length ? "" : `<p>Nothing waiting.</p>`}
   ${rows.map(x => { const d = x.decision || {}, i = x.input || {}, dr = x.delivery_receipts || {};
     return `<div class="card"><b>${esc(d.item_name || i.description)}${d.variation_name && d.variation_name!=="Regular" ? " — " + esc(d.variation_name) : ""}</b>
     <div class="muted">${esc(dr.supplier)} · ${esc(dr.department)} · cost ex GST ${d.unit_cost_ex != null ? "$" + Number(d.unit_cost_ex).toFixed(2) : "unknown"}</div>
     <div class="note">${esc(x.note || "")}</div>
     ${x.status === "needs_josh" && d.action && d.action !== "unsure" ? `<div class="row"><input id="p${x.id}" inputmode="decimal" placeholder="Shelf price incl. GST" style="max-width:220px"><button class="primary" onclick="setPrice(${x.id})">Set price and create</button></div><div id="m${x.id}"></div>` : `<p class="muted">Needs checking in a chat with Claude.</p>`}</div>`; }).join("")}
   <button class="secondary" onclick="homeScreen()">Back</button>`);
}
async function setPrice(id) {
  const v = document.getElementById("p" + id).value, m = document.getElementById("m" + id);
  m.innerHTML = `<div class="spinner"></div>`;
  const r = await api("/owner/price", { method: "POST", body: JSON.stringify({ line_id: id, price: v }) });
  const res = (r.body && r.body.result) || {};
  m.innerHTML = r.ok ? `<div class="note ok">${esc(res.status === "created" ? "Created in Square." : res.status === "dry_run" ? "Test mode: recorded, not created in Square." : (res.status || "Done"))}</div>` : `<div class="note err">${esc(r.body.error || "Couldn't save")}</div>`;
}
// ---------- recent deliveries (all retail; last 14 days in full, older months folded)
let RD = { dept: "All", recent: [], months: [], open: {}, photos: {}, err: false };
const dayFmt = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short" });
const monthFmt = (m) => new Date(m + "-01T00:00:00").toLocaleDateString("en-AU", { month: "long", year: "numeric" });
function rdShow(x) { return RD.dept === "All" || (x.depts || []).includes(RD.dept); }
function rdRow(x) {
  const p = x.kind === "photo" ? RD.photos[x.id] : null;
  const what = x.kind === "photo"
    ? `<span class="tag">photo</span> ${esc(p ? label(p) : "set-up")}`
    : `${x.invoice_number ? "#" + esc(x.invoice_number) + " · " : ""}${x.lines} line${x.lines === 1 ? "" : "s"}${x.booked != null && x.booked < x.lines ? ` · ${x.booked} booked` : ""}${x.waiting ? ` · <b style="color:var(--warn)">${x.waiting} waiting</b>` : ""}${x.open_jobs ? ` · <b style="color:var(--warn)">${x.open_jobs} job${x.open_jobs === 1 ? "" : "s"} open</b>` : ""}`;
  const tap = x.kind === "photo" && p && p.status === "submitted" ? ` onclick="itemsScreen(${ja(x.id)})" style="cursor:pointer"` : "";
  return `<div${tap}><span>${esc(x.supplier || "Unknown supplier")} <span class="muted">· ${esc((x.depts || []).join(", "))}</span></span><span class="muted" style="text-align:right">${what} · ${dayFmt(x.date)}</span></div>`;
}
function drawRecent() {
  if (!document.getElementById("recent") || !document.getElementById("months")) return;
  for (const d of ["All", ...DEPTS]) { const b = document.getElementById("rd-" + d.replace(" ", "")); if (b) b.className = (d === RD.dept ? "primary" : "secondary") + " small"; }
  const rows = RD.recent.filter(rdShow);
  document.getElementById("recent").innerHTML = RD.err ? `<span class="muted">Couldn't load deliveries. Try Home again in a minute.</span>`
    : rows.map(rdRow).join("") || `<span class="muted">No ${RD.dept === "All" ? "retail" : esc(RD.dept)} deliveries in the last 14 days.</span>`;
  document.getElementById("months").innerHTML = RD.months.map(m => {
    const o = RD.open[m.month], list = o && o.rows ? o.rows.filter(rdShow) : null;
    return `<div class="card" style="margin:10px 0 0;padding:10px 14px"><div onclick="toggleMonth(${ja(m.month)})" style="cursor:pointer;display:flex;justify-content:space-between"><b>${esc(monthFmt(m.month))}</b><span class="muted">${m.count} deliver${m.count === 1 ? "y" : "ies"} ${o ? "▾" : "▸"}</span></div>
      ${o ? `<div class="list" style="margin-top:6px">${o.loading ? '<span class="muted">Loading…</span>' : o.error ? `<span class="muted">Couldn't load this month. Tap the month to close it and try again.</span>` : (list.map(rdRow).join("") || `<span class="muted">None for ${esc(RD.dept)}.</span>`)}</div>` : ""}</div>`;
  }).join("");
}
let RD_SEQ = 0;
async function toggleMonth(m) {
  if (RD.open[m]) { delete RD.open[m]; return drawRecent(); }
  const seq = ++RD_SEQ, v = VIEW;
  RD.open[m] = { loading: true, seq }; drawRecent();
  let r; try { r = await api("/recent-deliveries?month=" + encodeURIComponent(m)); } catch (e) { r = { ok: false, body: {} }; }
  if (v !== VIEW || !RD.open[m] || RD.open[m].seq !== seq) return; // closed, reopened or navigated away meanwhile
  RD.open[m] = r.ok && Array.isArray(r.body && r.body.rows) ? { rows: r.body.rows, seq } : { error: true, seq };
  if (document.getElementById("months")) drawRecent();
}

function label(x){
  if (x.status === "submitted") return ({pending:"being set up", ready:"in Square — print labels", awaiting_price:"in Square — some waiting for a price", needs_josh:"waiting on Josh", failed:"problem — Josh notified", dry_run:"test run only (not in Square)", empty:"nothing new to set up"})[x.setup_status] || "sent";
  return ({uploading:"being saved", upload_failed:"not saved — send the photos again", reading:"being read", ready:"waiting for a check", error:"problem"})[x.status] || x.status;
}

// ---------- Deliveries: jobs from booked invoices (tags to change, boxes to count, Josh's price decisions)
let DLV = { cards: [], staff: [], owner: false }, WHO = null;
const money = (v) => v == null || v === "" ? "" : "$" + Number(v).toFixed(2);
const jobs = (c, kinds) => (c.tasks || []).filter(t => kinds.includes(t.kind));
const openJobs = (c, kinds) => jobs(c, kinds).filter(t => t.status === "open");
const dday = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short" }) : "";
const when = (d) => d ? new Date(d).toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit" }) : "";
function unitWord(u, n) {
  u = String(u || "each").toLowerCase();
  if (u === "kg") return "kg";
  if (u === "bunch") return n === 1 ? "bunch" : "bunches";
  if (u === "each" || u === "ea") return n === 1 ? "item" : "items";
  return u;
}
async function fetchDeliveries() {
  const r = await api("/deliveries");

// Shelf-tag job cell. apply_on_confirm jobs update the register only when staff confirm the tag is changed;

function tagCell(t) {
  const who = `${esc(t.done_by || "")} ${esc(when(t.done_at))}`;
  if (t.price_mode !== "apply_on_confirm") {
    if (t.status === "superseded") return `<span class="muted">Replaced by a newer price — use the newer tag</span>`;
    return t.status === "open" ? `<button class="primary small" onclick="tickTag(${t.id})">Done</button>` : `<span class="muted">✓ ${who}</span>`;
  }
  if (t.status === "superseded" || t.apply_state === "superseded") return `<span class="muted">Replaced by a newer price — use the newer tag</span>`;
  if (t.apply_state === "applied") return `<span class="muted">✓ Register updated · ${who}</span>`;
  if (t.apply_state === "conflict") return `<span class="note err" style="display:inline-block;margin:0">Josh needs to check: the register price was changed elsewhere.</span>`;
  if (t.status === "kept" || t.apply_state === "kept") return `<span class="muted">Josh kept the register price — leave this tag</span>`;
  if (t.apply_state === "restore") {
    const back = [...(t.main && t.main.restore ? [{ ...t.main, name: (t.info || {}).name }] : []), ...(Array.isArray(t.parts) ? t.parts : []).filter(p => p.restore)];

  }
  if (t.apply_state === "applying") return `<span class="muted">Updating the register…</span> <button class="secondary small" onclick="refreshDelivery()">Check</button>`;

}
let TAG_BUSY = {};

  $(`<h2>Price decisions</h2>${msg ? `<div class="note ${msg.ok ? "ok" : "err"}">${esc(msg.text)}</div>` : ""}
   ${rows.length ? rows.map(({ c, t }) => `<div class="card"><div class="muted">${esc(c.supplier)} · ${esc(dday(c.invoice_date))}</div>${holdRow(t)}</div>`).join("") : `<p>No price decisions waiting.</p>`}
   ${regs.length ? `<h3>Register prices to check</h3><p class="muted">The shelf-tag update stopped on these so nothing was overwritten blindly.</p>${regs.map(({ c, t, o }) => `<div class="card"><div class="muted">${esc(c.supplier)} · ${esc(dday(c.invoice_date))}</div>${opRow(t, o)}</div>`).join("")}` : ""}
   ${boxq.length ? `<h3>Box sizes</h3>${boxq.map(({ c, t }) => `<div class="card"><div class="muted">${esc(c.supplier)} · ${esc(dday(c.invoice_date))}</div>${boxDecisionRow(t)}</div>`).join("")}` : ""}
   ${news.length ? `<h3>New products counted by staff</h3><p class="muted">Set these up in a chat with Claude — the staff count is recorded.</p>${news.map(({ c, t }) => `<div class="card"><div class="muted">${esc(c.supplier)} · ${esc(dday(c.invoice_date))}</div>${countRow(t)}</div>`).join("")}` : ""}
   <div class="row"><button class="secondary" onclick="S.view=null;homeScreen()">Back</button></div>`);
}

// ---------- supplier
let SUP = { usual: [], others: [] };
async function supplierScreen() {
  $(`<h2>${esc(S.dept)} — which supplier?</h2><input id="sq" placeholder="Search suppliers" oninput="drawSup()"><div class="grid" id="sup" style="margin-top:14px"><div class="spinner"></div></div>
  <div class="row"><button class="secondary" onclick="homeScreen()">Back</button></div>`);
  RETRY = supplierScreen;
  const v = VIEW;
  const r = await api("/suppliers?department=" + encodeURIComponent(S.dept));
  if (v !== VIEW || !document.getElementById("sup")) return;
  if (!r.ok || !Array.isArray(r.body && r.body.usual) || !Array.isArray(r.body && r.body.others)) {
    document.getElementById("sup").innerHTML = `<div style="grid-column:1/-1">${loadErr(r, "the supplier list", "supplierScreen()")}</div>`;
    return;
  }
  SUP = r.body; drawSup();
}
function drawSup() {
  const q = (document.getElementById("sq").value || "").toLowerCase();
  const f = a => a.filter(n => n.toLowerCase().includes(q));
  const u = f(SUP.usual), o = f(SUP.others);
  const btn = n => `<button class="big" onclick="S.supplier=${ja(n)};photoScreen()">${esc(n)}</button>`;
  const head = t => `<div style="grid-column:1/-1" class="muted">${t}</div>`;
  document.getElementById("sup").innerHTML = (u.length || o.length) ? (u.length ? head("Usual for " + esc(S.dept)) + u.map(btn).join("") : "") + (o.length ? head("All other suppliers") + o.map(btn).join("") : "") :
    `<div class="note" style="grid-column:1/-1">Not found. Leave the paperwork on Josh's desk — it may be a new supplier.</div>`;
}

// ---------- photos
function photoScreen() {
  $(`<h2>${esc(S.supplier)}</h2><p class="q">Photograph every page of the invoice or delivery docket. Flat, good light, whole page in frame.</p>
  <label class="primary" style="display:inline-block">📷 Take photo<input type="file" accept="image/*" capture="environment" class="hidden" onchange="addPhotos(this.files)"></label>
  <div class="thumbs" id="th"></div><div id="pmsg"></div>
  <div class="row"><button class="primary" id="send" disabled onclick="sendPhotos()">Send to be read</button><button class="secondary" onclick="supplierScreen()">Back</button></div>`);
  drawThumbs();
}
function drawThumbs(){ document.getElementById("th").innerHTML = S.photos.map((p,i)=>`<div><img src="${p}"><br><button class="secondary small" onclick="S.photos.splice(${i},1);if(S.uncertain){S.op=newOp();S.uncertain=false;}drawThumbs()">Remove</button></div>`).join(""); document.getElementById("send").disabled = !S.photos.length; }
async function addPhotos(files) {
  if (!S.op) S.op = newOp();
  // changing the photo set after an uncertain send means it is a different upload
  if (S.uncertain) { S.op = newOp(); S.uncertain = false; }
  for (const f of files) { if (S.photos.length >= 6) break; S.photos.push(await shrink(f)); }
  drawThumbs();
}
function resumeDraft() { if (!DRAFT) return homeScreen(); S = { dept: DRAFT.dept, supplier: DRAFT.supplier, photos: DRAFT.photos, op: DRAFT.op, uncertain: DRAFT.uncertain, receipt: null }; DRAFT = null; photoScreen(); }
function discardDraft() { DRAFT = null; homeScreen(); }
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
      res(c.toDataURL("image/jpeg", 0.82));
    }; img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
async function sendPhotos() {
  const v = VIEW, btn = document.getElementById("send");
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  document.getElementById("pmsg").innerHTML = `<div class="spinner"></div>`;
  let r;
  if (!S.op) S.op = newOp();
  try { r = await api("/receipts", { method: "POST", body: JSON.stringify({ op_id: S.op, supplier: S.supplier, department: S.dept, images: S.photos.map(p => p.split(",")[1]) }) }); }
  catch (e) { return; } // 401: the setup screen has already been shown
  if (v !== VIEW || !document.getElementById("pmsg")) return;
  if (!r.ok || !(r.body && r.body.id)) {
    // Not replayed automatically. 503 is rejected before anything is saved; a lost connection or server error may or may not have saved it.
    const sure = r.status === 503 || r.status === 400;
    S.uncertain = !sure;
    const msg = sure ? `${r.body.error || "Couldn't send."} Nothing was saved — your photos are still here. Tap Send to try again.`
      : `${r.body.reason || r.body.error || "Couldn't send."} It may or may not have arrived. Your photos are kept (also if you go Home). Tap Send again: if it already arrived it won't be sent twice.`;
    document.getElementById("pmsg").innerHTML = `<div class="note err">${esc(msg)}</div>`;
    const b2 = document.getElementById("send"); if (b2) b2.disabled = !S.photos.length;
    return;
  }
  S.receipt = r.body.id; S.uncertain = false; DRAFT = null; readingScreen();
}

// ---------- reading
async function readingScreen() {
  $(`<h2>Reading it…</h2><p class="q">Usually under a minute. You can keep unpacking.</p><div class="spinner"></div>`);
  const t0 = Date.now(), v = VIEW;
  while (Date.now() - t0 < 240000) {
    await new Promise(r => setTimeout(r, 4000));
    if (v !== VIEW) return; // navigated away; the delivery shows under Recent deliveries when ready
    const r = await api("/receipts/" + S.receipt);
    if (v !== VIEW) return;
    if (r.body.status === "ready") return linesScreen(r.body);
    if (r.body.status === "error") return $(`<h2>Couldn't read it</h2><div class="note err">${esc(r.body.hold_reason || "Unknown problem")}</div><p>The photos are saved. Leave the paperwork for Josh.</p><button class="primary" onclick="homeScreen()">Done</button>`);
  }
  $(`<h2>Still reading</h2><p>It's taking longer than usual. It'll show under Recent deliveries when it's ready.</p><button class="primary" onclick="homeScreen()">OK</button>`);
}

// ---------- lines
let REC = null, LINES = [];
function norm(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function linesScreen(rec) {
  REC = rec; const x = rec.extraction || {};
  const known = Array.isArray(rec.known) ? rec.known : [];
  LINES = (x.lines || []).map((l, i) => ({ description: l.description, invoice_description: l.description, sku: l.sku, qty: l.qty, unit: l.unit, unit_price: l.unit_price, source: "invoice", note: "", barcode: "", known: known[i] || null }));
  const printed = x.supplier_printed || "";
  const supWarn = printed && !norm(printed).includes(norm(rec.supplier).slice(0,6)) && !norm(rec.supplier).includes(norm(printed).slice(0,6));
  $(`<h2>What came in?</h2><p class="q">Make this list match what's actually on the bench. Rename a line to what the product really is, split "assorted" lines into each kind with how many, and add anything missing. Counts = what actually arrived.</p>
  ${supWarn ? `<div class="note err">The paperwork says <b>${esc(printed)}</b> but you picked <b>${esc(rec.supplier)}</b>. If that's wrong, tap Cancel and start again.</div>` : ""}
  ${x.duplicate_of ? `<div class="note">This invoice number is already in the system. Only send it if there are new products on it.</div>` : ""}
  ${(x.uncertain||[]).length ? `<div class="note">Claude wasn't sure about: ${x.uncertain.map(esc).join("; ")}</div>` : ""}
  <div class="card"><div class="row" style="margin:0">
    <div style="flex:1;min-width:180px"><span class="muted">Invoice / docket number</span><input id="inv" value="${esc(x.invoice_number)}"></div>
    <div style="flex:1;min-width:180px"><span class="muted">Date</span><input id="dt" type="date" value="${esc(x.invoice_date)}"></div></div></div>
  <div class="card"><table><thead><tr><th>Product</th><th style="width:80px">How many</th><th style="width:80px">Unit</th><th style="width:96px">Cost each</th><th style="width:96px"></th></tr></thead><tbody id="ln"></tbody></table>
  <div class="row"><button class="secondary" onclick="addLine()">+ Add a product that's not listed</button></div></div>
  <div id="cmsg"></div>
  <div class="row"><button class="primary" id="go" onclick="submitLines()">Send for set-up</button><button class="secondary" onclick="cancelRec()">Cancel</button></div>`);
  drawLines();
}
function drawLines() {
  document.getElementById("ln").innerHTML = LINES.map((l,i)=>`<tr>
   <td><input value="${esc(l.description)}" onchange="renameLine(${i}, this.value)">${l.source!=="invoice"?`<span class="tag">${l.split_group ? "part of: " + esc(l.invoice_description||"") + (l.split_total!=null ? " (" + l.split_total + ")" : "") : l.source}</span>`:""}</td>
   <td><input inputmode="decimal" value="${esc(l.qty)}" onchange="LINES[${i}].qty=this.value"></td>
   <td><input value="${esc(l.unit)}" onchange="LINES[${i}].unit=this.value"></td>
   <td><input inputmode="decimal" value="${esc(l.unit_price)}" onchange="LINES[${i}].unit_price=this.value"></td>
   <td><button class="secondary small" onclick="splitLine(${i})">Split</button> <button class="secondary small" onclick="LINES.splice(${i},1);drawLines()">✕</button></td></tr>
   <tr class="sub"><td colspan="5"><div style="display:flex;gap:8px"><input placeholder="Note for set-up (optional), e.g. 'pink flowers', 'size small'" value="${esc(l.note)}" onchange="LINES[${i}].note=this.value" style="font-size:14px;padding:6px;flex:2">
   ${barcodeCell(l, i)}</div>${l.known ? `<div class="muted" style="font-size:13px;margin-top:4px">Already in Square: ${esc(l.known.name)}</div>` : ""}</td></tr>`).join("");
}
// A line that matches an existing product shows the barcode Square already holds (read-only, not re-sent).
// A matched product with no barcode says so: set-up only uses a scanned barcode when it creates a NEW product,
// so offering a scan there would not save anything. New products get the empty box and Scan button as before.
function barcodeCell(l, i) {
  if (l.known && l.known.upc) return `<input value="${esc(l.known.upc)}" readonly title="Barcode already in Square" aria-label="Barcode already in Square" style="font-size:14px;padding:6px;flex:1;background:#f1f1f1;color:#555"><span class="muted" style="font-size:13px;align-self:center">✓ on file</span>`;
  if (l.known) return `<span class="muted" style="font-size:13px;flex:1;align-self:center">No barcode in Square for this product</span>`;
  return `<input placeholder="Barcode" inputmode="numeric" value="${esc(l.barcode)}" onchange="LINES[${i}].barcode=this.value" style="font-size:14px;padding:6px;flex:1"><button class="secondary small" onclick="scanFor(${i})">Scan</button>`;
}
// Renaming a line away from the invoice wording means it may be a different product: drop the match so the barcode box returns.
function renameLine(i, v){ const l = LINES[i]; l.description = v; if (l.known && v !== l.invoice_description) { l.known = null; drawLines(); } }
function addLine(){ LINES.push({ description:"", qty:"", unit:"", unit_price:"", source:"added", note:"", barcode:"" }); drawLines(); }
// Splitting an invoice line (e.g. "Assorted 140mm x 20") turns the original and its parts into one group.
// The group keeps the invoice count as split_total; the parts' counts must add up to it (checked here and on the server).
// No part carries the shared supplier code, and the server never maps or replays a split group onto one variety.
let GROUP_SEQ = 0;
function splitLine(i){
  const l = LINES[i];
  if (!l.split_group) {
    const g = "g" + (++GROUP_SEQ);
    l.split_group = g; l.split_total = l.qty === "" || l.qty == null ? null : Number(l.qty);
    l.split_sku = l.sku || null; l.sku = null; l.source = "split"; l.qty = ""; l.known = null;   // split parts are different products
  }
  LINES.splice(i+1, 0, { description: l.description, invoice_description: l.invoice_description, qty: "", unit: l.unit, unit_price: l.unit_price,
    sku: null, split_sku: l.split_sku, split_group: l.split_group, split_total: l.split_total, source: "split", note: "", barcode: "" });
  drawLines();
}
function groupProblems(lines){
  const groups = {};
  for (const l of lines) if (l.split_group) (groups[l.split_group] ||= []).push(l);
  const out = [];
  for (const [g, rows] of Object.entries(groups)) {
    const sum = rows.reduce((a, r) => a + (Number(r.qty) || 0), 0);
    if (rows.length < 2) out.push(`A split "${rows[0].invoice_description || rows[0].description}" has only one part — split it again or remove it.`);
    else if (rows[0].split_total != null && Math.abs(sum - rows[0].split_total) > 1e-9)
      out.push(`The parts of "${rows[0].invoice_description}" add up to ${sum}, but the paperwork says ${rows[0].split_total}. Fix the counts so they match.`);
  }
  return out;
}

// ---------- barcode scanner (camera)
let ZX = null, scanCtl = null;
async function scanFor(i) {
  const ov = document.createElement("div");
  ov.id = "scanov"; ov.style.cssText = "position:fixed;inset:0;background:#000d;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px";
  ov.innerHTML = `<video id="scanv" style="width:min(92vw,640px);border-radius:12px" playsinline muted></video><div style="color:#fff">Point the camera at the barcode</div><button class="secondary" onclick="stopScan()">Cancel</button>`;
  document.body.appendChild(ov);
  try {
    if (!ZX) { await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); ZX = new window.ZXingBrowser.BrowserMultiFormatReader(); }
    scanCtl = await ZX.decodeFromVideoDevice(undefined, "scanv", (result) => {
      if (result) { LINES[i].barcode = result.getText(); stopScan(); drawLines(); }
    });
  } catch (e) { ov.querySelector("div").textContent = "Camera not available — type the barcode numbers instead."; }
}
function stopScan(){ try { scanCtl && scanCtl.stop(); } catch(e){} scanCtl = null; const o = document.getElementById("scanov"); if (o) o.remove(); }
async function submitLines() {
  const m = document.getElementById("cmsg");
  const live = LINES;
  if (!live.length) { m.innerHTML = '<div class="note err">Nothing to send.</div>'; return; }
  for (const [index, line] of live.entries()) {
    const count = Number(line.qty);
    const problem = !String(line.description ?? "").trim() ? "Enter a product name or remove this row."
      : !Number.isFinite(count) || count <= 0 ? "Enter the quantity that arrived or remove this row." : "";
    if (problem) {
      m.innerHTML = '<div class="note err">Row ' + (index + 1) + ': ' + problem + '</div>';
      return;
    }
  }
  const gp = groupProblems(live);
  if (gp.length) { m.innerHTML = '<div class="note err">' + esc(gp[0]) + '</div>'; return; }
  const go = document.getElementById("go");
  if (go.disabled) return;
  go.disabled = true;
  m.innerHTML = '<div class="spinner"></div>';
  const path = `/receipts/${REC.id}`;
  try {
    const r = await api(path + "/submit", { method: "POST", body: JSON.stringify({
      invoice_number: document.getElementById("inv").value,
      invoice_date: document.getElementById("dt").value, lines: live.map(({ known, ...l }) => l)   // known = display only, never sent
    }) });
    if (!r.ok) {
      if (r.status === 409) {
        const current = await api(path);
        if (current.ok && current.body.status === "submitted") {
          S.receipt = null;
          $('<h2>Already sent</h2><p>Check this delivery under Recent deliveries.</p><button class="primary" onclick="homeScreen()">Done</button>');
          return;
        }
      }
      m.innerHTML = `<div class="note err">${esc(r.body.error || "Couldn't send")}</div>`;
      return;
    }
  } catch {
    m.innerHTML = '<div class="note err">Couldn’t confirm delivery. Check the connection and tap Send again on this receipt.</div>';
    return;
  } finally {
    go.disabled = false;
  }
  S.receipt = null;
  $(`<h2>Sent ✓</h2><div class="note ok">${live.length} product${live.length>1?"s":""} sent for set-up.</div>
   <p>New products will be added to Square automatically. When this delivery shows <b>"in Square — print labels"</b> under Recent deliveries, print the shelf tags and plant labels from Square.</p>
   <p class="muted">Keep the paperwork with the others as usual.</p><button class="primary" onclick="homeScreen()">Done</button>`);
}
async function cancelRec(){ await api(`/receipts/${REC.id}/cancel`, { method: "POST" }); homeScreen(); }

document.addEventListener("click", idle); document.addEventListener("input", idle);
homeScreen();
</script>
</body>
</html>
