<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deliveries">
<meta name="theme-color" content="#2f4a3a">
<title>Poppie's — Receive delivery</title>
<style>
:root{--ink:#1f2a24;--quiet:#5d6b63;--line:#d9dfdb;--bg:#f6f4ef;--card:#fff;--green:#2f4a3a;--accent:#3d6b52;--warn:#a3561c;--bad:#a12b2b}
*{box-sizing:border-box}
body{margin:0;font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);padding:env(safe-area-inset-top) 0 40px}
header{background:var(--green);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:19px;margin:0}
header button{background:transparent;color:#fff;border:1px solid #ffffff80;padding:6px 12px;border-radius:8px;font-size:15px}
main{max-width:900px;margin:0 auto;padding:20px}
h2{font-size:22px;margin:4px 0 14px}
p.q{color:var(--quiet);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.big{display:block;width:100%;padding:18px 12px;font-size:19px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
.big.on,.big:active{border-color:var(--accent);background:#e6efe9}
.primary{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:16px 22px;font-size:19px;font-weight:600}
.primary:disabled{opacity:.45}
.secondary{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:17px;color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.pin{font-size:34px;letter-spacing:12px;text-align:center;height:52px;margin:10px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto}
.pad button{padding:18px;font-size:24px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
input,select{font-size:17px;padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--ink)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.thumbs img{width:110px;height:140px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse}
th{font-size:13px;text-align:left;color:var(--quiet);font-weight:600;padding:6px 4px}
td{padding:4px;vertical-align:top}
td input{padding:8px}
td.chk{text-align:center;width:52px}
td.chk input{width:26px;height:26px}
.note{border-left:4px solid var(--warn);background:#fbf1e8;padding:10px 12px;border-radius:6px;margin:10px 0;font-size:15px}
.ok{border-left-color:var(--accent);background:#e6efe9}
.err{border-left-color:var(--bad);background:#f8e6e6}
.muted{color:var(--quiet);font-size:14px}
.spinner{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;margin:30px auto}
@keyframes s{to{transform:rotate(360deg)}}
.list div{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>Poppie's · Receive delivery</h1><button id="out" class="hidden" onclick="signOut()">Sign out</button></header>
<main id="app"></main>
<script>
const API = "https://xcolpextsojdtbfscvse.supabase.co/functions/v1/delivery-app";
const DEPTS = ["Garden","Grocer","Cafe","Gift Store"];
let S = { token: null, name: null, dept: "Garden", supplier: null, photos: [], receipt: null };
try { const t = JSON.parse(sessionStorage.getItem("pd") || "null"); if (t) Object.assign(S, t); } catch (e) {}
const $ = (h) => { document.getElementById("app").innerHTML = h; window.scrollTo(0,0); };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){ try { sessionStorage.setItem("pd", JSON.stringify({token:S.token,name:S.name,dept:S.dept})); } catch(e){} }
async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { "content-type": "application/json", ...(S.token ? {"x-delivery-token": S.token} : {}) } });
  const b = await r.json().catch(() => ({}));
  if (r.status === 401 && S.token) { signOut("Please sign in again."); throw new Error("signed out"); }
  return { ok: r.ok, status: r.status, body: b };
}
function signOut(msg){ S.token = null; S.name = null; save(); document.getElementById("out").classList.add("hidden"); staffScreen(msg); }

// ---------- sign in
async function staffScreen(msg) {
  $(`<h2>Who's receiving?</h2>${msg ? `<div class="note">${esc(msg)}</div>` : ""}<div class="grid" id="staff"><div class="spinner"></div></div>`);
  const r = await api("/staff");
  document.getElementById("staff").innerHTML = (r.body || []).map(s => `<button class="big" onclick='pinScreen(${s.id}, ${JSON.stringify(s.name)}, ${s.pin_set})'>${esc(s.name)}</button>`).join("") || "Can't reach the system — check the Wi-Fi.";
}
let pinBuf = "", pinFirst = null;
function pinScreen(id, name, set) {
  pinBuf = ""; pinFirst = null;
  const title = set ? `Hi ${esc(name)} — enter your PIN` : `Hi ${esc(name)} — set your PIN`;
  $(`<h2>${title}</h2><p class="q">${set ? "Same as your Square code." : "Use your Square code (4–6 digits). You'll type it twice."}</p>
  <div class="pin" id="pd"></div><div id="pmsg"></div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pk('${n}')">${n}</button>`).join("")}
  <button onclick="pk('del')">⌫</button><button onclick="pk('0')">0</button><button onclick='pk("go",${id},${JSON.stringify(name)},${set})' style="background:var(--accent);color:#fff">OK</button></div>
  <div class="row"><button class="secondary" onclick="staffScreen()">Back</button></div>`);
}
async function pk(k, id, name, set) {
  if (k === "del") pinBuf = pinBuf.slice(0,-1);
  else if (k !== "go") { if (pinBuf.length < 6) pinBuf += k; }
  document.getElementById("pd").textContent = "•".repeat(pinBuf.length);
  if (k !== "go") return;
  const m = document.getElementById("pmsg");
  if (pinBuf.length < 4) { m.innerHTML = `<div class="note">4 to 6 digits.</div>`; return; }
  if (!set && pinFirst === null) { pinFirst = pinBuf; pinBuf = ""; document.getElementById("pd").textContent = ""; m.innerHTML = `<div class="note ok">Now type it again to confirm.</div>`; return; }
  if (!set && pinFirst !== pinBuf) { pinFirst = null; pinBuf = ""; document.getElementById("pd").textContent = ""; m.innerHTML = `<div class="note err">They didn't match — start again.</div>`; return; }
  const r = await api("/login", { method: "POST", body: JSON.stringify({ staff_id: id, pin: pinBuf }) });
  if (!r.body.ok) { pinBuf = ""; document.getElementById("pd").textContent = ""; m.innerHTML = `<div class="note err">${esc(r.body.reason || "Couldn't sign in")}</div>`; return; }
  S.token = r.body.token; S.name = r.body.name; save();
  document.getElementById("out").classList.remove("hidden");
  homeScreen();
}

// ---------- home
async function homeScreen() {
  S.photos = []; S.supplier = null; S.receipt = null;
  $(`<h2>New delivery</h2><p class="q">Signed in as ${esc(S.name)}. Which department is it for?</p>
  <div class="grid">${DEPTS.map(d=>`<button class="big ${d===S.dept?"on":""}" onclick="S.dept='${d}';save();supplierScreen()">${d}</button>`).join("")}</div>
  <h2 style="margin-top:28px">Recent</h2><div class="list" id="recent"><span class="muted">Loading…</span></div>`);
  const r = await api("/recent");
  document.getElementById("recent").innerHTML = (r.body || []).map(x => `<div><span>${esc(x.supplier)} · ${esc(x.department)}</span><span class="muted">${esc(label(x.status))} · ${new Date(x.created_at).toLocaleDateString("en-AU",{day:"numeric",month:"short"})}</span></div>`).join("") || `<span class="muted">Nothing yet.</span>`;
}
function label(s){ return ({reading:"being read",ready:"waiting for a check",booked:"booked",held:"needs Josh",duplicate:"already in system",error:"problem"})[s] || s; }

// ---------- supplier
let SUP = { usual: [], others: [] };
async function supplierScreen() {
  $(`<h2>${esc(S.dept)} — which supplier?</h2><input id="sq" placeholder="Search suppliers" oninput="drawSup()"><div class="grid" id="sup" style="margin-top:14px"><div class="spinner"></div></div>
  <div class="row"><button class="secondary" onclick="homeScreen()">Back</button></div>`);
  const r = await api("/suppliers?department=" + encodeURIComponent(S.dept));
  SUP = r.body || { usual: [], others: [] }; drawSup();
}
function drawSup() {
  const q = (document.getElementById("sq").value || "").toLowerCase();
  const f = a => a.filter(n => n.toLowerCase().includes(q));
  const u = f(SUP.usual), o = f(SUP.others);
  const btn = n => `<button class="big" onclick='S.supplier=${JSON.stringify(n)};photoScreen()'>${esc(n)}</button>`;
  const head = t => `<div style="grid-column:1/-1" class="muted">${t}</div>`;
  document.getElementById("sup").innerHTML = (u.length || o.length) ? (u.length ? head("Usual for " + esc(S.dept)) + u.map(btn).join("") : "") + (o.length ? head("All other suppliers") + o.map(btn).join("") : "") :
    `<div class="note">Not found. Type more of the name, or tell Josh it's a new supplier — leave the invoice on his desk for now.</div>`;
}

// ---------- photos
function photoScreen() {
  $(`<h2>${esc(S.supplier)}</h2><p class="q">Photograph every page of the invoice. Flat, in good light, whole page in frame.</p>
  <label class="primary" style="display:inline-block">📷 Take photo<input type="file" accept="image/*" capture="environment" multiple class="hidden" onchange="addPhotos(this.files)"></label>
  <div class="thumbs" id="th"></div><div id="pmsg"></div>
  <div class="row"><button class="primary" id="send" disabled onclick="sendPhotos()">Send to be read</button><button class="secondary" onclick="supplierScreen()">Back</button></div>`);
  drawThumbs();
}
function drawThumbs(){ document.getElementById("th").innerHTML = S.photos.map((p,i)=>`<div><img src="${p}"><br><button class="secondary" style="padding:4px 10px;font-size:14px" onclick="S.photos.splice(${i},1);drawThumbs()">Remove</button></div>`).join(""); document.getElementById("send").disabled = !S.photos.length; }
async function addPhotos(files) {
  for (const f of files) { if (S.photos.length >= 6) break; S.photos.push(await shrink(f)); }
  drawThumbs();
}
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
      res(c.toDataURL("image/jpeg", 0.82));
    }; img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
async function sendPhotos() {
  document.getElementById("send").disabled = true;
  document.getElementById("pmsg").innerHTML = `<div class="spinner"></div>`;
  const r = await api("/receipts", { method: "POST", body: JSON.stringify({ supplier: S.supplier, department: S.dept, images: S.photos.map(p => p.split(",")[1]) }) });
  if (!r.ok) { document.getElementById("pmsg").innerHTML = `<div class="note err">${esc(r.body.reason || r.body.error || "Couldn't send")}</div>`; document.getElementById("send").disabled = false; return; }
  S.receipt = r.body.id; readingScreen();
}

// ---------- reading
async function readingScreen() {
  $(`<h2>Reading the invoice…</h2><p class="q">Usually under a minute. You can unpack while you wait.</p><div class="spinner"></div>`);
  const t0 = Date.now();
  while (Date.now() - t0 < 240000) {
    await new Promise(r => setTimeout(r, 4000));
    const r = await api("/receipts/" + S.receipt);
    if (r.body.status === "ready") return checkScreen(r.body);
    if (r.body.status === "error") return $(`<h2>Couldn't read it</h2><div class="note err">${esc(r.body.hold_reason || "Unknown problem")}</div><p>The photos are saved. Leave the paper invoice for Josh.</p><button class="primary" onclick="homeScreen()">Done</button>`);
  }
  $(`<h2>Still reading</h2><p>It's taking longer than usual. It'll show under Recent when it's done.</p><button class="primary" onclick="homeScreen()">OK</button>`);
}

// ---------- check lines
let REC = null;
function checkScreen(rec) {
  REC = rec; const x = rec.extraction || {};
  const lines = (x.lines || []).map(l => ({ description: l.description, sku: l.sku, qty: l.qty, unit: l.unit, unit_price: l.unit_price }));
  const unc = (x.uncertain || []);
  $(`<h2>Check every line</h2><p class="q">Compare with the paper invoice. Fix anything wrong, then tick the line. Quantity = what actually arrived.</p>
  ${x.kind === "statement" ? `<div class="note err">This looks like a statement or delivery docket, not an invoice. Don't book it — tap Cancel.</div>` : ""}
  ${x.duplicate_of ? `<div class="note err">This invoice number is already in the system. Don't book it again — tap Cancel, unless Josh says otherwise.</div>` : ""}
  ${unc.length ? `<div class="note">Claude wasn't sure about: ${unc.map(esc).join("; ")}</div>` : ""}
  <div class="card"><div class="row" style="margin:0">
    <div style="flex:1;min-width:180px"><span class="muted">Invoice number</span><input id="inv" value="${esc(x.invoice_number)}"></div>
    <div style="flex:1;min-width:180px"><span class="muted">Invoice date</span><input id="dt" type="date" value="${esc(x.invoice_date)}"></div></div></div>
  <div class="card"><table><thead><tr><th>Item</th><th style="width:80px">Qty</th><th style="width:80px">Unit</th><th style="width:100px">Price each</th><th>OK</th></tr></thead><tbody id="ln"></tbody></table>
  <div class="row"><button class="secondary" onclick="addLine()">+ Add a line Claude missed</button></div></div>
  ${x.totals && x.totals.total != null ? `<p class="muted">Invoice total printed: $${esc(x.totals.total)}</p>` : ""}
  <div id="cmsg"></div>
  <div class="row"><button class="primary" id="book" onclick="book()">Book to stock</button><button class="secondary" onclick="cancelRec()">Cancel</button></div>`);
  LINES = lines; drawLines();
}
let LINES = [];
function drawLines() {
  document.getElementById("ln").innerHTML = LINES.map((l,i)=>`<tr>
   <td><input value="${esc(l.description)}" onchange="LINES[${i}].description=this.value"></td>
   <td><input inputmode="decimal" value="${esc(l.qty)}" onchange="LINES[${i}].qty=this.value"></td>
   <td><input value="${esc(l.unit)}" onchange="LINES[${i}].unit=this.value"></td>
   <td><input inputmode="decimal" value="${esc(l.unit_price)}" onchange="LINES[${i}].unit_price=this.value"></td>
   <td class="chk"><input type="checkbox" ${l.ok?"checked":""} onchange="LINES[${i}].ok=this.checked"><br><button class="secondary" style="padding:2px 8px;font-size:13px;margin-top:4px" onclick="LINES.splice(${i},1);drawLines()">✕</button></td></tr>`).join("");
}
function addLine(){ LINES.push({ description:"", qty:"", unit:"", unit_price:"", ok:false }); drawLines(); }
async function book() {
  const m = document.getElementById("cmsg");
  const live = LINES.filter(l => String(l.description||"").trim());
  if (!live.length) { m.innerHTML = `<div class="note err">No lines to book.</div>`; return; }
  if (live.some(l => !l.ok)) { m.innerHTML = `<div class="note">Tick every line once you've checked it against the paper invoice.</div>`; return; }
  if (live.some(l => l.qty === "" || l.qty == null || l.unit_price === "" || l.unit_price == null)) { m.innerHTML = `<div class="note">Every line needs a quantity and a price.</div>`; return; }
  document.getElementById("book").disabled = true; m.innerHTML = `<div class="spinner"></div>`;
  const r = await api(`/receipts/${REC.id}/confirm`, { method: "POST", body: JSON.stringify({ invoice_number: document.getElementById("inv").value, invoice_date: document.getElementById("dt").value, lines: live }) });
  if (!r.ok) { m.innerHTML = `<div class="note err">${esc(r.body.reason || r.body.error || "Couldn't book")}</div>`; document.getElementById("book").disabled = false; return; }
  const res = r.body.result || {};
  if (r.body.status === "duplicate") return $(`<h2>Already in the system</h2><p>This invoice number was already booked. Nothing was added twice.</p><button class="primary" onclick="homeScreen()">Done</button>`);
  const un = res.unmatched_descriptions || [];
  $(`<h2>Booked ✓</h2><div class="note ok">${res.booked ?? 0} of ${res.lines ?? live.length} lines went to stock.</div>
   ${un.length ? `<div class="note">${un.length} new item${un.length>1?"s":""} not in the system yet — Josh will sort ${un.length>1?"these":"this"}:<br>${un.map(esc).join("<br>")}</div>` : ""}
   <p class="muted">Keep the paper invoice with the others as usual.</p><button class="primary" onclick="homeScreen()">Done</button>`);
}
async function cancelRec(){ await api(`/receipts/${REC.id}/cancel`, { method: "POST" }); homeScreen(); }

if (S.token) { document.getElementById("out").classList.remove("hidden"); homeScreen(); } else staffScreen();
</script>
</body>
</html>
